[project]
name = "vaga-viva-clinic"
version = "0.0.0"
description = "API de um sistema fictício de agendamento de clínica (modelo python-fastapi do Vaga Viva)"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "pyyaml==6.0.4",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--junitxml=reports/junit.xml", "-ra"]
junit_suite_name = "vaga-viva"
markers = [
    "mission(id): testes de uma missão do Vaga Viva (o id é o do catálogo, por exemplo patients-api)",
]

[tool.ruff]
line-length = 120
