# Workflow do Vaga Viva: roda os testes e publica o relatório JUnit para o revisor de PR.
# Não faz parte de nenhuma missão; não altere este arquivo.
name: Vaga Viva

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Dependências
        run: uv sync --locked

      - name: Testes
        run: uv run pytest

      - name: Relatório JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: ignore
